services:
  # 1. AI Inference Backend (Flask + YOLOv8-Pose + P2PNet)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_classroom_server
    restart: unless-stopped
    expose:
      - "3838"
    volumes:
      - server_uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1

  # 2. Frontend Web Client (React + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_classroom_client
    restart: unless-stopped
    ports:
      - "3838:80"
    depends_on:
      - server

volumes:
  server_uploads:
